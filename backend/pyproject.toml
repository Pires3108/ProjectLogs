[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ataviva-cli"
version = "0.1.0"
description = "Gerador local de documentos AtaViva (CLI, sem site/API)"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
