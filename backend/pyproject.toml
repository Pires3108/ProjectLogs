[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ataviva-api"
version = "0.1.0"
description = "API de processamento de reuniões do AtaViva"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "boto3>=1.40,<2",
    "celery[redis]>=5.5,<6",
    "fastapi>=0.116,<1",
    "google-cloud-tasks>=2.19,<3",
    "markdown-it-py>=4,<5",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.10,<3",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "prometheus-client>=0.22,<1",
    "python-json-logger>=3.3,<4",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pyyaml>=6,<7",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
